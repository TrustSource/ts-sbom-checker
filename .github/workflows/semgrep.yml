name: Semgrep

# Static analysis with Semgrep OSS (community rules for Python and GitHub Actions). Findings do not
# fail the job; the SARIF result is kept as a workflow artifact and, on pushes to main and scheduled
# runs, imported into TrustSource (POST <base_url>/core/tests/sarif, project and module
# "ts-sbom-checker"), like the Bandit result. The import is best effort and never fails the run.
# Pull requests only scan.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '41 7 * * 2'
  workflow_dispatch:

permissions:
  contents: read

env:
  # API version belongs to the base URL, never to the method paths
  TS_API_BASE_URL: https://api.trustsource.io/v2
  TS_PROJECT_NAME: ts-sbom-checker
  TS_MODULE_NAME: ts-sbom-checker
  SEMGREP_VERSION: '1.184.0'

jobs:
  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      - name: Run Semgrep
        run: |
          pip install "semgrep==$SEMGREP_VERSION"
          semgrep scan --config p/python --config p/github-actions --metrics=off \
            --sarif-output=semgrep.sarif src .github

      - name: Keep SARIF as artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: semgrep-sarif
          path: semgrep.sarif

      - name: Import SARIF into TrustSource
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          TS_API_KEY: ${{ secrets.TRUSTSOURCE_API_KEY }}
          BRANCH: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          if [ -z "$TS_API_KEY" ]; then
            echo "TRUSTSOURCE_API_KEY is not available to this repository."
            exit 1
          fi
          curl --silent --show-error --fail-with-body \
            --request POST "$TS_API_BASE_URL/core/tests/sarif" \
            --header "x-api-key: $TS_API_KEY" \
            --header "Content-Type: application/json" \
            --url-query "projectName=$TS_PROJECT_NAME" \
            --url-query "moduleName=$TS_MODULE_NAME" \
            --url-query "branch=$BRANCH" \
            --url-query "tag=$COMMIT" \
            --data-binary @semgrep.sarif
