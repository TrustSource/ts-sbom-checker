[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ts-sbom-checker"
version = "0.1.0"
description = "Checks SBOMs (CycloneDX, SPDX) against their JSON schema and the requirements of BSI TR-03183-2"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "EACG GmbH / TrustSource", email = "support@trustsource.io" }]
requires-python = ">=3.12"
keywords = ["sbom", "cyclonedx", "spdx", "bsi", "tr-03183", "cra", "compliance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "jsonschema-rs>=0.60",
    "packageurl-python>=0.15",
    "click>=8.1",
]

# Development tools are a dependency group (PEP 735), not an extra: they are not distributed and
# must not appear in the package metadata (Requires-Dist), where SBOM scanners would pick them up.
# Install with: pip install --group dev -e .   (pip >= 25.1)
[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "build>=1.2"]

[project.scripts]
ts-sbom-checker = "ts_sbom_checker.cli:main"

[project.urls]
Homepage = "https://github.com/TrustSource/ts-sbom-checker"
Issues = "https://github.com/TrustSource/ts-sbom-checker/issues"
Changelog = "https://github.com/TrustSource/ts-sbom-checker/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ts_sbom_checker = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["SIM108"]
